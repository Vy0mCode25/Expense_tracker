databases:
  - name: ad-tech-expense-tracker-db
    plan: free

services:
  - type: web
    name: ad-tech-expense-tracker-api
    runtime: python
    plan: free
    branch: main
    rootDir: expense-salary-tracker
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: ad-tech-expense-tracker-db
          property: connectionString

  - type: web
    name: ad-tech-expense-tracker-frontend
    runtime: static
    plan: free
    branch: main
    rootDir: expense-salary-tracker/frontend
    buildCommand: "echo 'static site, no build needed'"
    staticPublishPath: .
    autoDeploy: true