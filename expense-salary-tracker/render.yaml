services:
  - type: web
    name: ad-tech-expense-tracker-api
    runtime: python
    plan: free
    branch: main
    rootDir: expense-salary-tracker
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: postgresql://neondb_owner:npg_ezHjr5dm2END@ep-young-unit-ax3pqb2q-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
        sync: false
        # Set this manually in the Render dashboard -> Environment tab.
        # Use a free, non-expiring Postgres like Neon (neon.tech) — paste
        # its connection string here. If left unset, falls back to a local
        # SQLite file, which does NOT persist across Render deploys.

  - type: web
    name: ad-tech-expense-tracker-frontend
    runtime: static
    plan: free
    branch: main
    rootDir: expense-salary-tracker/frontend
    buildCommand: "echo 'static site, no build needed'"
    staticPublishPath: .
    autoDeploy: true